[project]
name = "discount-auto-ops"
version = "1.2.0"
description = "Discount Auto Ops -- vehicle-centric shop, recon, and we-owe management"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "mcp>=1.21,<2",
  "pystray>=0.19,<1",
  "pillow>=10.0,<12",
  "pywebview>=6.2.1",
]

[project.scripts]
discount-auto-ops = "app.tray_app:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.4,<9",
    "ruff>=0.16.0",
]
build = ["pyinstaller>=6.10,<7"]

[tool.ruff]
target-version = "py312"
# The house style leans on long single-line dict payloads, especially in tests;
# 88 would wrap hundreds of them for no readability gain.
line-length = 120

[tool.ruff.lint]
# B008: call-in-default-argument is idiomatic FastAPI (Query()/Depends() defaults).
# DTZ005/DTZ011: naive local time is correct here -- RECON is a single-site
# desktop app and RO numbers, export filenames, etc. are meant to be shop-local.
ignore = ["B008", "DTZ005", "DTZ011"]

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "standard"
include = ["app", "tests", "seed_mock_data.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
