<dialog id="confirm-dialog">
  <div class="modal confirm-modal">
    <div class="modal-head">
      <div><p class="eyebrow" id="confirm-eyebrow">CONFIRM</p><h2 id="confirm-title">Are you sure?</h2></div>
    </div>
    <div class="modal-body"><p id="confirm-body" class="confirm-body"></p></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" type="button" id="confirm-cancel">Cancel</button>
      <button class="btn btn-ghost" type="button" id="confirm-alt" hidden></button>
      <button class="btn btn-primary" type="button" id="confirm-accept">Confirm</button>
    </div>
  </div>
</dialog>
