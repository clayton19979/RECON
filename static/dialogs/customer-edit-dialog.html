<!-- Edit Customer Dialog (We-Owe only) -->
<dialog id="customer-edit-dialog">
  <form class="modal" id="customer-edit-form">
    <div class="modal-head">
      <div><p class="eyebrow">CUSTOMER</p><h2>Edit Customer</h2></div>
      <button class="icon-btn" formnovalidate type="button" id="customer-edit-cancel">×</button>
    </div>
    <div class="modal-body">
      <label>Name<input id="customer-edit-name" required autofocus></label>
      <div class="form-row">
        <label>Phone<input id="customer-edit-phone" type="tel" inputmode="tel" autocomplete="off" placeholder="(313) 555-0142"></label>
        <label>Email<input id="customer-edit-email" type="email"></label>
      </div>
      <p class="section-eyebrow" style="margin:6px 0 2px">Address</p>
      <div class="addr-autocomplete">
        <label>Street<input id="customer-edit-address1" autocomplete="off" placeholder="Start typing an address…"></label>
        <div class="addr-suggestions" id="customer-edit-address-suggestions" hidden></div>
      </div>
      <label>Apt / Unit<input id="customer-edit-address2" autocomplete="off"></label>
      <div class="form-row">
        <label style="flex:2">City<input id="customer-edit-city" autocomplete="off"></label>
        <label style="flex:1">State<input id="customer-edit-state" maxlength="2" autocapitalize="characters" placeholder="MI" autocomplete="off"></label>
        <label style="flex:1">ZIP<input id="customer-edit-postal" inputmode="numeric" maxlength="10" placeholder="48203" autocomplete="off"></label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" formnovalidate type="button" id="customer-edit-cancel-2">Cancel</button>
      <button class="btn btn-primary" type="submit">Save</button>
    </div>
  </form>
</dialog>
