<!-- Confirm Dialog
     Destructive actions used to go through window.confirm(), which the OS
     renders as a bare browser chrome alert -- no context about *what* is
     being deleted, no way to distinguish "remove a line" from "restore the
     whole database over the top of the live one", and no styling that says
     danger. This is one dialog reused by every call site; see
     confirmAction() in app.js. -->
<!-- Invoice-number Prompt Dialog
     A confirm with one required text field, shown only once the vendor's
     credit paperwork has actually arrived for a core or part that already
     went back -- not at the moment of the return itself. Reused by every
     call site via promptInvoiceNumber() in app.js. -->
<dialog id="invoice-prompt-dialog">
  <form class="modal" id="invoice-prompt-form">
    <div class="modal-head">
      <div><p class="eyebrow" id="invoice-prompt-eyebrow">RETURN</p><h2 id="invoice-prompt-title">Vendor invoice #</h2></div>
      <button class="icon-btn" formnovalidate type="button" id="invoice-prompt-cancel">×</button>
    </div>
    <div class="modal-body">
      <p class="hint" id="invoice-prompt-body"></p>
      <label id="invoice-prompt-label-wrap">Invoice / credit #<input id="invoice-prompt-input" required minlength="1" placeholder="e.g. CR-10442" autocomplete="off" autofocus></label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" formnovalidate type="button" id="invoice-prompt-cancel-2">Cancel</button>
      <button class="btn btn-primary" type="submit" id="invoice-prompt-accept">Save</button>
    </div>
  </form>
</dialog>
