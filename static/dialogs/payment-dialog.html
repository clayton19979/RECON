<!-- Take Payment Dialog (We-Owe only) -->
<dialog id="payment-dialog">
  <form class="modal" id="payment-form">
    <div class="modal-head">
      <div><p class="eyebrow">DEPOSIT</p><h2>Take Payment</h2></div>
      <button class="icon-btn" formnovalidate type="button" id="payment-cancel">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>Amount<input id="vd-deposit-amount" type="number" min="0.01" step="0.01" autofocus></label>
        <label>Method<select id="vd-deposit-method">
          <option value="cash">Cash</option>
          <option value="card">Card</option>
          <option value="check">Check</option>
          <option value="bank">Bank</option>
          <option value="other">Other</option>
        </select></label>
      </div>
      <label>Note<input id="vd-deposit-note" placeholder="Optional"></label>
      <div style="padding:6px 0"><button type="button" class="btn btn-primary btn-sm" id="vd-deposit-add">Record Deposit</button></div>
      <div id="vd-deposits-list" class="mini-list" style="padding:0"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" formnovalidate type="button" id="payment-cancel-2">Close</button>
    </div>
  </form>
</dialog>
