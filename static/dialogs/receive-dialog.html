<!-- Receive Parts Dialog -->
<dialog id="receive-dialog">
  <form class="modal" id="receive-form">
    <div class="modal-head">
      <div><p class="eyebrow">RECEIVE PARTS</p><h2>Post to A/P</h2></div>
      <button class="icon-btn" formnovalidate type="button" id="receive-cancel">×</button>
    </div>
    <div class="modal-body">
      <!-- Each price starts at what the line was quoted at and is editable,
           because the invoice in your hand is the number that's true. This is
           the one moment the app writes the car's cost and the vendor's bill
           from the same figure; correcting it afterwards fixes only one of
           them. -->
      <div class="receive-lines" id="receive-lines"></div>
      <!-- The dialog opens on the vendor these parts were most likely bought
           from, and says why underneath when it has a real reason (see
           preferredVendor). The note is not shown for a shop-wide "bought from
           them last" guess -- that says nothing about these parts. -->
      <label>Vendor<select id="receive-vendor"><option value="__new__">＋ New vendor…</option></select></label>
      <p class="receive-vendor-why" id="receive-vendor-why" hidden></p>
      <div id="receive-new-vendor" style="display:none">
        <label>New vendor name<input id="receive-new-vendor-name" placeholder="WorldPac"></label>
      </div>
      <label>Invoice #<input id="receive-invoice-number" required placeholder="INV-1234" autofocus></label>
      <label>Tax<input id="receive-tax" type="number" min="0" step="0.01" value="0"></label>
      <div class="cost-summary" id="receive-total-summary"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" formnovalidate type="button" id="receive-cancel-2">Cancel</button>
      <button class="btn btn-primary" type="submit">Post &amp; Receive</button>
    </div>
  </form>
</dialog>
