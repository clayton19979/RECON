<!-- Write Retail RO Dialog (Customers screen) -->
<dialog id="retail-ro-dialog">
  <form class="modal" id="retail-ro-form">
    <div class="modal-head">
      <div><p class="eyebrow">REPAIR ORDER</p><h2>Write Repair Order</h2></div>
      <button class="icon-btn" formnovalidate type="button" id="retail-ro-cancel">×</button>
    </div>
    <div class="modal-body">
      <div class="kv-row"><span class="kv-label">Customer</span><span class="kv-value" id="retail-ro-customer"></span></div>
      <div class="kv-row" style="margin-bottom:8px"><span class="kv-label">Vehicle</span><span class="kv-value" id="retail-ro-vehicle"></span></div>
      <!-- Shown only when this car still has an open we-owe promise. Not a
           block: a customer who is owed a tie rod can perfectly well also pay
           for brakes, and that second job really is retail. It is a reminder,
           because putting promised work on a retail ticket puts its cost on
           the wrong side of the books and the promise never closes. -->
      <p class="hint warn" id="retail-ro-owe-note" hidden></p>
      <label>What's being done<textarea id="retail-ro-concern" required minlength="3" placeholder="e.g. Brakes grinding — inspect front and rear"></textarea></label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" formnovalidate type="button" id="retail-ro-cancel-2">Cancel</button>
      <button class="btn btn-primary" type="submit">Start Repair Order</button>
    </div>
  </form>
</dialog>
