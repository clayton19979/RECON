<!-- Add Vehicle Dialog — another car for an existing customer. Opened from
     the retail vehicle page (Other Vehicles card) and from a customer's
     expansion on the Customers screen; the customer is already chosen, the
     form only asks about the car. -->
<dialog id="vehicle-add-dialog">
  <form class="modal" id="vehicle-add-form">
    <div class="modal-head">
      <div><p class="eyebrow">VEHICLE</p><h2>Add Vehicle</h2></div>
      <button class="icon-btn" formnovalidate type="button" id="vehicle-add-cancel">×</button>
    </div>
    <div class="modal-body">
      <div class="kv-row" style="margin-bottom:8px"><span class="kv-label">Customer</span><span class="kv-value" id="vehicle-add-customer"></span></div>
      <div class="form-row">
        <label>Year<input id="vehicle-add-year" type="number" required min="1900" max="2100"></label>
        <label>Make<input id="vehicle-add-make" required></label>
      </div>
      <label>Model<input id="vehicle-add-model" required></label>
      <div class="form-row">
        <label style="flex:2">VIN<input id="vehicle-add-vin" autocapitalize="characters" autocomplete="off"></label>
        <label style="flex:1">Mileage<input id="vehicle-add-mileage" type="number" min="0"></label>
      </div>
      <div class="form-row">
        <label style="flex:2">Plate<input id="vehicle-add-plate" autocapitalize="characters" autocomplete="off"></label>
        <label style="flex:1">Plate state<input id="vehicle-add-plate-state" maxlength="2" autocapitalize="characters" placeholder="MI" autocomplete="off"></label>
        <label style="flex:2">Color<input id="vehicle-add-color"></label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" formnovalidate type="button" id="vehicle-add-cancel-2">Cancel</button>
      <button class="btn btn-primary" type="submit">Add Vehicle</button>
    </div>
  </form>
</dialog>
