<dialog id="vehicle-edit-dialog">
  <form class="modal" id="vehicle-edit-form">
    <div class="modal-head">
      <div><p class="eyebrow">VEHICLE</p><h2>Edit Vehicle</h2></div>
      <button class="icon-btn" formnovalidate type="button" id="vehicle-edit-cancel">×</button>
    </div>
    <div class="modal-body">
      <!-- Recon only: a stock number is the lot's own number for a car it
           owns, so a we-owe or retail car simply doesn't have one. Hidden
           rather than disabled for those, matching the arrival-date row
           below -- see renderDetailHead. -->
      <div id="vd-stock-row">
        <div class="form-row">
          <label>Stock #<input id="vd-recon-stock" maxlength="40" placeholder="R-1042" autofocus></label>
        </div>
        <p class="hint">Fixing a mistyped stock number here updates it everywhere — the board, reports and this car's whole history.</p>
      </div>
      <div class="form-row" style="align-items:flex-end">
        <label style="flex:2">VIN<input id="vd-recon-vin"></label>
        <button type="button" class="btn btn-ghost btn-sm" id="vd-decode-vin" style="margin-bottom:12px">Decode VIN</button>
      </div>
      <div class="form-row">
        <label>Mileage<input id="vd-recon-mileage" type="number" min="0"></label>
        <label>Year<input id="vd-recon-year" type="number" required></label>
      </div>
      <div class="form-row">
        <label>Make<input id="vd-recon-make" required></label>
        <label>Model<input id="vd-recon-model" required></label>
      </div>
      <div class="form-row">
        <label>Trim<input id="vd-recon-trim"></label>
        <label>Color<input id="vd-recon-color"></label>
      </div>
      <!-- Every segment has a plate: the lot's own cars wear a dealer tag, a
           we-owe car wears the customer's. It is the identifier you can read
           from across the lot, and the search bar looks it up. -->
      <div class="form-row">
        <label style="flex:2">Plate<input id="vd-recon-plate" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
        <label style="flex:1">Plate state<input id="vd-recon-plate-state" maxlength="2" placeholder="IN" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
      </div>
      <!-- Recon only: a we-owe car was sold long before the shop saw it, so
           it has no arrival date to keep. Hidden rather than disabled for the
           other segments -- see renderDetailHead. -->
      <div id="vd-acquired-row">
        <div class="form-row">
          <label>Arrived on the lot<input id="vd-recon-acquired" type="date"></label>
        </div>
        <p class="hint">What the Age column counts from. Leave it blank if nobody knows, and Age falls back to the day the car was written up.</p>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" formnovalidate type="button" id="vehicle-edit-cancel-2">Cancel</button>
      <button class="btn btn-primary" type="submit" id="vd-recon-info-save">Save</button>
    </div>
  </form>
</dialog>
